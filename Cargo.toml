[workspace]
resolver = "2"
members = ["crates/app", "crates/editor-core", "crates/i18n", "crates/markdown"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
gpui = "=0.2.2"
ropey = "1.6"
notify = "8"
encoding_rs = "0.8"
chardetng = "0.1"
syntect = "5"
regex = "1"
fancy-regex = "0.14"
rayon = "1"
memmap2 = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
dirs = "6"
pulldown-cmark = { version = "0.13", default-features = false }

[profile.release]
lto = "thin"
codegen-units = 1

# D11.2 (дев-опыт): горячие leaf-зависимости редактора в dev-сборке
# без оптимизаций замедляют открытие файлов и правки в разы относительно
# release; opt-level=3 точечно для ropey (rope-мутации/строки) и
# encoding_rs (декодирование) ускоряет debug, не трогая gpui (время
# сборки) и не меняя release-профиль.
[profile.dev.package.ropey]
opt-level = 3

[profile.dev.package.encoding_rs]
opt-level = 3
