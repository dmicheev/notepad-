[workspace]
resolver = "2"
members = ["crates/app", "crates/editor-core", "crates/i18n"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
gpui = "=0.2.2"
ropey = "1.6"
notify = "8"
encoding_rs = "0.8"
chardetng = "0.1"
syntect = "5"
regex = "1"
fancy-regex = "0.14"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
dirs = "6"

[profile.release]
lto = "thin"
codegen-units = 1
